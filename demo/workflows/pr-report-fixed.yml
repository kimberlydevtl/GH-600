# M3 demo, step 2: replace the broken version with this one.
# The fix: elevate ONE job, by ONE scope. The top-level default stays read-only.
name: pr-report
on: pull_request
permissions:
  contents: read
jobs:
  report:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: bash scripts/verify.sh || true
      - name: Comment on PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr comment ${{ github.event.pull_request.number }} --body-file .verify/report.md
